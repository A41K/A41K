name: Generate README with Markscribe

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install markscribe
        run: |
          go install github.com/taciturnaxolotl/markscribe@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Generate README
        run: |
          markscribe -write README.md README.tpl.md
        env:
          WAKATIME_API_KEY: ${{ secrets.HACKATIME_API_KEY }}
          WAKATIME_URL: https://hackatime.hackclub.com/api/v1/